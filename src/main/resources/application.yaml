spring:
  application:
    name: today-fish-backend

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: false

# 공공데이터 API 설정
collection:
  at:
    end-point: https://apis.data.go.kr/B552845/katSale/trades
    service-key: ${AT_SERVICE_KEY}
    page-size: 1000
    connect-timeout: 3s
    read-timeout: 10s
  kmi:
    end-point: http://fish-api.kmi.re.kr:9090/API/openAPI.do
    service-key: ${KMI_SERVICE_KEY}
    page-size: 1000
    connect-timeout: 3s
    read-timeout: 10s
