
name: "L2 Backend Task"
description: "Backend 구현·검증을 위한 PR 단위 작업"
title: "[L2-XX] "
type: Task
projects:
  - "today-fish/1"

body:
  - type: markdown
    attributes:
      value: |
        ## Backend L2 작업 등록
        - Level: L2
        - Status: Backlog
        - workstream: BE 또는 INFRA
        - 우선순위: Medium
        - Start date: 생성일

        위 Project 필드는 Issue 생성 후 설정합니다.

  - type: textarea
    id: goal
    attributes:
      label: 작업 목표
      description: "이번 작업에서 달성할 결과를 작성합니다."
      placeholder: "구현 목적과 기대 결과"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 세부 작업
      description: "하나의 PR에서 완료할 작업을 작성합니다."
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
        - [ ] 작업 3
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: "구현 및 검증 완료 여부를 판단할 기준입니다."
      placeholder: |
        - [ ] 기능 정상 동작 확인
        - [ ] 관련 테스트 통과
    validations:
      required: true

  - type: input
    id: parent
    attributes:
      label: 상위 L1 Issue
      description: "해당 작업이 속한 L1 Issue를 입력합니다."
      placeholder: "today-fish/today-fish-docs#20"
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 문서
      description: "관련 ADR, Tech Spec, PRD 등을 작성합니다."
      placeholder: "관련 문서 경로 또는 링크"
